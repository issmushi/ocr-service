[project]
name = "ocr-service"
version = "0.1.0"
description = "Unified OCR API, PaddleOCR, RussianDocsOCR, QR and queue worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.136.3,<0.137.0",
    "uvicorn[standard]>=0.48.0,<0.49.0",
    "python-multipart>=0.0.20,<0.1.0",
    "httpx>=0.28.0,<0.29.0",
    "pillow>=10.0.0,<12.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "aio-pika>=9.5.0,<10.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "alembic>=1.16.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "setuptools>=70.0.0",
    "numpy>=1.26.0,<2.4",
    "pandas>=2.2.0,<4.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "opencv-python>=4.13.0.92,<5.0.0.0",
    "mrzscanner-docsaid==1.0.7",
    "capybara-docsaid==0.12.0",
    "PyTurboJPEG==1.7.7",
    "onnxruntime==1.22.0; sys_platform == 'darwin'",
    "onnxruntime-gpu==1.22.0; sys_platform == 'linux'",
    "paddleocr>=3.6.0,<4.0.0",
    "paddlepaddle>=3.2.0,<4.0.0",
    "qrcode[pil]>=8.2,<9.0",
    "cryptography>=44.0.0,<51.0.0",
]

[project.scripts]
run-api = "app.main:run"
run-ocr-service = "app.main:run"

[tool.poetry]
packages = [{ include = "app" }]

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "ruff>=0.15.22,<0.16.0"]

[tool.ruff]
target-version = "py311"
line-length = 79
extend-exclude = [
    "app/ocr_engine/russian/vendor",
    "dataset",
    "logs",
    "storage",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP035", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
